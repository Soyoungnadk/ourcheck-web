# 매일 아침 6시(KST) 청약 공고·주변 시세를 다시 받아 페이지를 갱신한다.
#
# 브라우저는 공공데이터포털 API 를 CORS 로 직접 못 부른다.
# 그래서 여기서 대신 받아 index.html 에 구워 넣는다.
#
# 필요한 설정은 Secret 하나뿐이다:
#   Settings → Secrets and variables → Actions → New repository secret
#     이름: DATA_GO_KR_KEY
#     값  : 공공데이터포털 일반 인증키
#
# 이 저장소 자신에게 push 하므로 GitHub 이 자동으로 주는 토큰으로 충분하다.
# (별도 PAT 을 만들 필요가 없다)

name: Daily Data

on:
  schedule:
    # Actions 는 UTC 기준. 21:00 UTC = 익일 06:00 KST
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 공고·시세 수집 후 페이지 갱신
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/build_data.py --out index.html

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- index.html; then
            echo "변경 없음 — 오늘은 새 공고가 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: 공고·시세 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
